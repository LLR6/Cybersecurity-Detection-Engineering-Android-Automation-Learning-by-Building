name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          actual = data["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag {tag} does not match pyproject version {actual}")
          print(f"version OK: {actual}")
          PY

      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"
          python -m build

      - name: Inspect distribution
        run: |
          python -m pip install "twine>=5"
          python -m twine check dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*             --verify-tag             --generate-notes             --title "${GITHUB_REF_NAME}"
