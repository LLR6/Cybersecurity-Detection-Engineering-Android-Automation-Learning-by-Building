name: NightWatch CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: nightwatch --version
      - run: pytest -q
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - run: nightwatch samples/demo.jsonl --format md --out report.md
      - name: Evaluate labeled demo
        run: python scripts/evaluate_sample.py samples/demo.jsonl samples/demo.truth.json --out evaluation.md --fail-on-regression
      - name: Evaluate benign regression corpus
        run: python scripts/evaluate_sample.py samples/benign.jsonl samples/benign.truth.json --out benign-evaluation.md --fail-on-regression
      - name: Build evaluation JSON artifact
        run: python scripts/evaluate_sample.py samples/demo.jsonl samples/demo.truth.json --format json --out evaluation.json
      - name: Validate evaluation JSON schema
        run: python scripts/validate_json_schema.py schemas/evaluation-report.schema.json evaluation.json
      - name: Hash report artifacts
        run: sha256sum report.md evaluation.md benign-evaluation.md > reports.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/nightwatch --version
      - uses: actions/upload-artifact@v4
        with:
          name: nightwatch-report
          path: |
            report.md
            evaluation.md
            benign-evaluation.md
            reports.sha256
