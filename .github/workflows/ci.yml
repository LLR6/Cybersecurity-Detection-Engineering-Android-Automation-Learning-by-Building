name: NightWatch CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Check local documentation links
        run: python scripts/check_local_links.py
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q src/nightwatch
      - name: Smoke-test installed CLI
        run: nightwatch --help > /dev/null
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: nightwatch --version
      - run: pytest -q
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - run: nightwatch samples/demo.jsonl --format md --out report.md
      - name: Coverage snapshot
        run: |
          python -m pip install "coverage>=7.6"
          coverage run --source=src/nightwatch -m pytest
          coverage report -m --fail-under=50
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v7
        with:
          name: Cybersecurity-Detection-Engineering-Android-Automation-Learning-by-Building-coverage-${{ matrix.python-version || 'py' }}
          path: coverage.xml
      - name: Evaluate labeled demo
        run: python scripts/evaluate_sample.py samples/demo.jsonl samples/demo.truth.json --out evaluation.md --fail-on-regression
      - name: Evaluate benign regression corpus
        run: python scripts/evaluate_sample.py samples/benign.jsonl samples/benign.truth.json --out benign-evaluation.md --fail-on-regression
      - name: Performance smoke
        run: python scripts/perf_smoke.py samples/demo.jsonl --repeats 5 --output performance-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightwatch-performance-smoke-${{ matrix.python-version || 'default' }}
          path: performance-smoke.json

      - name: Build evaluation JSON artifact
        run: python scripts/evaluate_sample.py samples/demo.jsonl samples/demo.truth.json --format json --out evaluation.json
      - name: Validate evaluation JSON schema
        run: python scripts/validate_json_schema.py schemas/evaluation-report.schema.json evaluation.json
      - name: Hash report artifacts
        run: sha256sum report.md evaluation.md benign-evaluation.md > reports.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/nightwatch --version
      - uses: actions/upload-artifact@v7
        with:
          name: nightwatch-report
          path: |
            report.md
            evaluation.md
            benign-evaluation.md
            reports.sha256
