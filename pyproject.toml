[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-nightwatch"
version = "0.3.0"
description = "Local-first security event correlation and behavior detection engine"
requires-python = ">=3.11"
authors = [{name = "LLR6"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nightwatch = "nightwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
