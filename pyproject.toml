[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-nightwatch"
version = "0.4.0"
description = "Local-first security event correlation and behavior detection engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "LLR6"}]
license = {file = "LICENSE"}
keywords = ["security", "detection-engineering", "blue-team", "telemetry", "incident-response"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nightwatch = "nightwatch.cli:main"

[project.urls]
Homepage = "https://github.com/LLR6/Cybersecurity-Detection-Engineering-Android-Automation-Learning-by-Building"
Repository = "https://github.com/LLR6/Cybersecurity-Detection-Engineering-Android-Automation-Learning-by-Building"
Issues = "https://github.com/LLR6/Cybersecurity-Detection-Engineering-Android-Automation-Learning-by-Building/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
